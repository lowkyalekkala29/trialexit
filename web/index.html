<!doctype html>
<html lang="en">

    <meta charset="utf-8" />

    <div id="root"><div class="boot">Loading…</div></div>

    <script type="module" src="app.js?v=__APP_VERSION__"></script>
    <script type="module" src="reminders.js"></script>
    <script>
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        addEventListener('load', () => navigator.serviceWorker.register('sw.js').then((r) => r.update()).catch(() => {}));
      }
    </script>
  </body>
