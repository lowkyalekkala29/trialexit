<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TrialExit</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <div class="wrap">
      <header class="top">
        <span class="brand"><span class="mark">✓</span><h1 style="font-size: 15px">TrialExit</h1></span>
        <button class="sm" id="open-dash">All trials</button>
      </header>
      <div id="mini"></div>
      <div style="display: grid; gap: 8px; margin-top: 12px">
        <div id="detect-area"></div>
        <button id="scan-gmail" style="width: 100%">Find trials in my email</button>
      </div>
      <p class="hint" style="margin: 10px 0 0; text-align: center">Read on your device. Nothing leaves your browser.</p>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
